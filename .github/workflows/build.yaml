
name: Build AwoX ESPHome firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate secrets.yaml
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MESH_NAME: ${{ secrets.MESH_NAME }}
          MESH_PASSWORD: ${{ secrets.MESH_PASSWORD }}
          OTA_PASSWORD: ${{ secrets.OTA_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import json

          values = {
              "wifi_ssid": os.environ["WIFI_SSID"],
              "wifi_password": os.environ["WIFI_PASSWORD"],
              "mqtt_host": "192.168.101.138",
              "mqtt_user": os.environ["MQTT_USER"],
              "mqtt_password": os.environ["MQTT_PASSWORD"],
              "mesh_name": os.environ["MESH_NAME"],
              "mesh_password": os.environ["MESH_PASSWORD"],
              "ota_password": os.environ["OTA_PASSWORD"],
          }

          with open("secrets.yaml", "w") as f:
              for key, value in values.items():
                  f.write(f"{key}: {json.dumps(value)}\n")
          PY

      - name: Build firmware
        id: build
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: awox-ble-mesh-hub.yaml
          version: latest

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: awox-firmware
          path: ${{ steps.build.outputs.name }}/
          if-no-files-found: error
