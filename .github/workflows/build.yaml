
name: Build AwoX ESPHome firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: awox-ble-mesh-hub.yaml
          version: 2025.12.0
